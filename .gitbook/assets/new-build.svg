<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">A new build on Appetize</title>
  <desc id="desc">A native change is built, then the build is put on the app running on Appetize. The CLI controls the device and does not carry the build.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; fill: #656d76; }
    .box-title { font-size: 18px; font-weight: 700; }
    .box-sub { font-size: 14px; fill: #656d76; }
    .arrow { font-size: 15px; font-weight: 700; }
    .arrow-sub { font-size: 13px; fill: #656d76; }
  </style>
  <rect width="960" height="400" fill="#ffffff"/>

  <text class="label" x="40" y="36">YOUR MACHINE</text>
  <text class="label" x="700" y="36">APPETIZE</text>

  <rect x="40" y="56" width="250" height="72" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="box-title" x="60" y="86">Your change</text>
  <text class="box-sub" x="60" y="108">Native code or app config</text>

  <rect x="40" y="164" width="250" height="72" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="box-title" x="60" y="194">Build</text>
  <text class="box-sub" x="60" y="216">A new app to install</text>

  <rect x="40" y="292" width="250" height="72" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="box-title" x="60" y="322">Appetize CLI</text>
  <text class="box-sub" x="60" y="344">Session, taps, screenshots</text>

  <rect x="680" y="120" width="240" height="120" rx="12" fill="#fbefff" stroke="#8250df"/>
  <text class="box-title" x="700" y="164">The app</text>
  <text class="box-sub" x="700" y="190">Running on the device</text>
  <text class="box-sub" x="700" y="214">Shows the new build</text>

  <path d="M165 128 V164" stroke="#d0d7de" stroke-width="2" fill="none"/>
  <path d="M290 200 H668" stroke="#8250df" stroke-width="2.5" fill="none"/>
  <path d="M656 192 L676 200 L656 208" fill="#8250df"/>
  <text class="arrow" x="390" y="186" style="fill:#8250df">Install</text>
  <text class="arrow-sub" x="360" y="228">Put the build on the device</text>

  <path d="M290 328 C480 328, 560 280, 760 252" stroke="#656d76" stroke-width="2.5" fill="none"/>
  <path d="M746 256 L768 248 L752 240" fill="#656d76"/>
  <text class="arrow" x="310" y="300" style="fill:#656d76">Control</text>
</svg>
